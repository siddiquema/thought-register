<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thought Register</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>Thought Register</h1>
</header>
<main>
  <div id="migration-banner" class="banner" hidden>
    <p id="migration-banner-text"></p>
    <div class="banner-actions">
      <button type="button" id="migration-banner-backup" class="banner-btn">Download backup</button>
      <button type="button" id="migration-banner-dismiss" class="banner-btn-secondary">Dismiss</button>
    </div>
  </div>

  <section id="capture">
    <div class="mode-toggle" role="tablist">
      <button type="button" id="mode-quick" class="mode-tab active" role="tab" aria-selected="true" aria-controls="quick-form">Quick</button>
      <button type="button" id="mode-structured" class="mode-tab" role="tab" aria-selected="false" aria-controls="structured-form">Structured</button>
    </div>

    <form id="quick-form" class="capture-form" novalidate role="tabpanel" aria-labelledby="mode-quick">
      <label for="quick-thought" class="visually-hidden">Thought</label>
      <textarea id="quick-thought" name="thought" class="capture-input" placeholder="Capture a thought…" rows="1"></textarea>

      <div class="capture-footer">
        <button type="button" id="quick-topic-toggle" class="topic-toggle">+ Topic</button>
        <label for="quick-topic" class="visually-hidden">Topic (optional)</label>
        <input type="text" id="quick-topic" name="topic" class="topic-input" placeholder="Topic" hidden>
        <button type="submit" class="save-btn">Save</button>
      </div>
    </form>

    <form id="structured-form" class="capture-form" hidden novalidate role="tabpanel" aria-labelledby="mode-structured">
      <label for="structured-observation" class="visually-hidden">Observation</label>
      <textarea id="structured-observation" name="observation" class="capture-input" placeholder="What did you observe?" rows="1"></textarea>

      <label for="structured-interpretation" class="visually-hidden">Interpretation (optional)</label>
      <textarea id="structured-interpretation" name="interpretation" class="capture-input capture-input-secondary" placeholder="What does it mean? (optional)" rows="1"></textarea>

      <div class="capture-footer">
        <button type="button" id="structured-topic-toggle" class="topic-toggle">+ Topic</button>
        <label for="structured-topic" class="visually-hidden">Topic (optional)</label>
        <input type="text" id="structured-topic" name="topic" class="topic-input" placeholder="Topic" hidden>
        <button type="submit" class="save-btn">Save</button>
      </div>
    </form>

    <p id="save-confirmation" class="confirmation" aria-live="polite"></p>
  </section>

  <section id="log">
    <div class="log-header">
      <h2>Captured</h2>
      <div class="export-actions">
        <button type="button" id="export-markdown-btn" class="export-btn" disabled>Export Markdown</button>
        <button type="button" id="export-csv-btn" class="export-btn" disabled>Export CSV</button>
        <button type="button" id="export-json-btn" class="export-btn" disabled>Export JSON</button>
        <label for="import-json-input" class="export-btn import-btn">Import JSON</label>
        <input type="file" id="import-json-input" accept="application/json" class="visually-hidden">
      </div>
    </div>
    <label for="search-input" class="visually-hidden">Search your thoughts</label>
    <input type="search" id="search-input" class="search-input" placeholder="Search your thoughts…">

    <div class="filter-panel">
      <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-fields">Filters</button>
      <div id="filter-fields" class="filter-fields" hidden>
        <div class="filter-field">
          <label for="filter-category">Category</label>
          <select id="filter-category"></select>
        </div>
        <div class="filter-field">
          <label for="filter-lifecycle">Status</label>
          <select id="filter-lifecycle"></select>
        </div>
        <div class="filter-field">
          <label for="filter-type">Type</label>
          <select id="filter-type">
            <option value="">Any</option>
            <option value="quick">Quick</option>
            <option value="structured">Structured</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-review-status">Review status</label>
          <select id="filter-review-status">
            <option value="">Any</option>
            <option value="unreviewed">Unreviewed</option>
            <option value="reviewed">Reviewed</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-importance">Importance</label>
          <select id="filter-importance"></select>
        </div>
        <div class="filter-field">
          <label for="filter-confidence">Confidence</label>
          <select id="filter-confidence"></select>
        </div>
        <div class="filter-field">
          <label for="filter-project">Project</label>
          <input type="text" id="filter-project" placeholder="Any">
        </div>
        <div class="filter-field">
          <label for="filter-tags">Tags</label>
          <input type="text" id="filter-tags" placeholder="comma, separated">
        </div>
        <div class="filter-field">
          <label for="filter-date-from">From</label>
          <input type="date" id="filter-date-from">
        </div>
        <div class="filter-field">
          <label for="filter-date-to">To</label>
          <input type="date" id="filter-date-to">
        </div>
        <button type="button" id="filter-clear" class="filter-clear">Clear filters</button>
      </div>
    </div>

    <ul id="thought-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state" aria-live="polite">Nothing captured yet.</p>
    <p id="no-results-state" class="empty-state" aria-live="polite" hidden>No matching thoughts found.</p>
  </section>

  <section id="detail" hidden>
    <button type="button" id="detail-back" class="back-btn">&larr; Back</button>

    <div class="detail-meta">
      <span id="detail-type" class="detail-type"></span>
      <span id="detail-timestamps" class="detail-timestamps"></span>
    </div>

    <form id="detail-form">
      <label class="detail-label" for="detail-topic">Topic</label>
      <input type="text" id="detail-topic" class="detail-input">

      <div id="detail-quick-fields">
        <label class="detail-label" for="detail-thought">Thought</label>
        <textarea id="detail-thought" class="detail-input" rows="3"></textarea>
      </div>

      <div id="detail-structured-fields">
        <label class="detail-label" for="detail-observation">Observation</label>
        <textarea id="detail-observation" class="detail-input" rows="3"></textarea>
        <label class="detail-label" for="detail-interpretation">Interpretation</label>
        <textarea id="detail-interpretation" class="detail-input" rows="3"></textarea>
      </div>

      <div class="detail-grid">
        <div>
          <label class="detail-label" for="detail-category">Category</label>
          <select id="detail-category" class="detail-select"></select>
        </div>
        <div>
          <label class="detail-label" for="detail-lifecycle">Lifecycle</label>
          <select id="detail-lifecycle" class="detail-select"></select>
        </div>
        <div>
          <label class="detail-label" for="detail-project">Project</label>
          <input type="text" id="detail-project" class="detail-input">
        </div>
        <div>
          <label class="detail-label" for="detail-tags">Tags</label>
          <input type="text" id="detail-tags" class="detail-input" placeholder="comma, separated">
        </div>
        <div>
          <label class="detail-label" for="detail-importance">Importance</label>
          <select id="detail-importance" class="detail-select"></select>
        </div>
        <div>
          <label class="detail-label" for="detail-confidence">Confidence</label>
          <select id="detail-confidence" class="detail-select"></select>
        </div>
      </div>

      <label class="detail-checkbox">
        <input type="checkbox" id="detail-reviewed">
        Reviewed
      </label>

      <div class="detail-actions">
        <button type="submit" class="save-btn">Save Changes</button>
        <button type="button" id="detail-delete" class="delete-btn">Delete</button>
      </div>
    </form>
    <p id="detail-save-confirmation" class="confirmation" aria-live="polite"></p>
  </section>
</main>
<script src="js/db.js"></script>
<script src="js/taxonomy.js"></script>
<script src="js/storage.js"></script>
<script src="js/search.js"></script>
<script src="js/export.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>
</body>
</html>
